9Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39Df0N/Q39B4CSQQ6QBwlf/Z"}, {"id": 7, "title": "Pressure, flow & resistance", "official": "Blood Flow-Influence of pressure changes and resistance: Understand the relationship between pressure, flow, and resistance in the vasculature and be able to calculate for one variable if the other two are known. Explain how blood flow to any organ is altered by changes in resistance to that organ.", "big": "Blood moves because of a pressure difference; resistance opposes its movement.", "analogy": "Imagine water flowing from a high tank through a hose. More push increases flow; squeezing the hose decreases flow.", "teach": "The equation is Q̇ = ΔP / R. Holding resistance constant, doubling the pressure difference doubles flow. Holding the pressure difference constant, doubling resistance halves flow. Be able to rearrange: ΔP = Q̇R and R = ΔP/Q̇.", "flow": "Pressure gradient ↑ → flow ↑. Resistance ↑ → flow ↓ (if gradient unchanged).", "confuse": "Flow (mL/min) is not the same as velocity (cm/s).", "remember": "Flow = push ÷ resistance.", "pages": "43–50", "slide": 55, "figure": ""}, {"id": 8, "title": "Poiseuille’s law", "official": "Resistance-Poiseuille’s Law: Explain how Poiseuille’s Law influences resistance to flow.", "big": "Vessel radius has an exceptionally strong effect on resistance.", "analogy": "A straw becomes extremely hard to drink through when you pinch it even a little.", "teach": "Poiseuille’s equation is R = 8ηl/(πr⁴). Resistance increases with viscosity (η) and vessel length (l), but decreases with the FOURTH POWER of radius (r). If radius halves, resistance rises 16-fold under the equation’s assumptions. If radius doubles, resistance becomes 1/16. Arteriolar constriction therefore has a large effect on flow.", "flow": "Radius ↓ → resistance ↑↑↑↑ → flow ↓ (if ΔP constant).", "confuse": "Radius and diameter are different; doubling diameter also doubles radius.", "remember": "R ∝ 1/r⁴. Radius rules.", "pages": "43–50", "slide": 59, "figure": ""}, {"id": 9, "title": "Systolic & diastolic blood pressure", "official": "Blood Pressure: Analyze the factors that impact the arterial blood pressures during systole and diastole, comparing the systemic and pulmonary circulation.", "big": "Systolic pressure is the arterial peak during ejection; diastolic pressure is the low point between beats.", "analogy": "Picture the aorta as a stretchy balloon attached to a small outlet: each pump adds water; the outlet lets it drain.", "teach": "The left ventricle generates high-pressure systemic flow, while the pulmonary circulation runs at lower pressure. Aortic elasticity stores energy during systole and releases it in diastole. Arteriolar resistance limits runoff, so blood delivery becomes more continuous by the time it reaches capillaries. Mean circulatory pressure refers to the equilibrated pressure when circulation stops, and depends on blood volume and vascular capacity.", "flow": "Aortic recoil + arteriolar resistance → arterial pressure persists between beats.", "confuse": "Systolic/diastolic are arterial pressures, not the same as ventricular filling volumes.", "remember": "Systole = squeeze; diastole = relax and recoil.", "pages": "51–59", "slide": 56, "figure": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQoMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAI3AvQDAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAUEBgMCAQf/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAGX+fq3mgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYn1523k1cwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwPtzsvLq5gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgfbnZeXVzAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADA+3Oy8urmAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGB9udl5dXMAAAAAAAAAAAAAAAAAAAAAAAA ap between systolic and diastolic pressure; MAP estimates average arterial pressure.", "analogy": "If pressure peaks at 120 and falls to 80, the gap is 40—not 120.", "teach": "PP = systolic BP − diastolic BP. The approximation in the notes is MAP = diastolic BP + PP/3. Example: 120/80 gives PP = 40 mmHg and MAP ≈ 93 mmHg. The average is closer to diastolic because the heart spends more time in diastole under ordinary resting conditions.", "flow": "Systolic − diastolic → PP; diastolic + one-third PP → MAP.", "confuse": "MAP is not simply the arithmetic midpoint of systolic and diastolic pressure.", "remember": "PP = gap; MAP = diastolic + ⅓ gap.", "pages": "51–59", "slide": 76, "figure": ""}, {"id": 11, "title": "What changes systolic, diastolic & pulse pressure?", "official": "Alterations in blood pressures: Using the activities from class, predict how arterial systolic, diastolic, and pulse pressure are affected by changes in a) stroke volume, b) aortic compliance, c) heart rate, and d) systemic vascular resistance. 121", "big": "Stroke volume, aortic compliance, heart rate and SVR change the pressure waveform in different ways.", "analogy": "Aorta = elastic balloon; stroke volume = water per squeeze; heart rate = squeeze frequency; SVR = size of outlet.", "teach": "More stroke volume typically raises systolic pressure and pulse pressure. Lower aortic compliance (stiffer aorta) raises systolic pressure and widens pulse pressure; diastolic pressure can fall. Faster heart rate shortens diastole and can limit pressure runoff, but effects depend on filling and stroke volume. Higher SVR slows runoff and tends to increase diastolic pressure, and can increase systolic pressure too. These are conditional predictions, not absolute rules.", "flow": "SV ↑ → systolic ↑; compliance ↓ → PP ↑; SVR ↑ → diastolic ↑; HR ↑ → shorter diastole.", "confuse": "Do not memorize HR ↑ = systolic ↑ in every scenario: rapid HR can reduce ventricular filling.", "remember": "SV = pump size; HR = pump frequency; compliance = stretch; SVR = drain.", "pages": "51–59", "slide": 79, "figure": ""}, {"id": 12, "title": "Hypertension", "official": "Hypertension: Diagnose an elevation in blood pressure as hypertensive and discuss potential causes of primary versus secondary hypertension.", "big": "Hypertension means arterial pressure is persistently elevated.", "analogy": "A plumbing system can run at high pressure because of too much pump output, too much downstream resistance, or both.", "teach": "Dr. Metz distinguishes primary (essential) hypertension, without one identifiable secondary disease, from secondary hypertension caused by a recognizable condition. Review the exact blood-pressure thresholds and examples given in the notes rather than inferring diagnosis from one reading. Sustained increases in cardiac output and/or systemic vascular resistance contribute to elevated arterial pressure.", "flow": "CO ↑ and/or SVR ↑ → MAP tends to rise.", "confuse": "Primary does not mean harmless; secondary means an identifiable cause.", "remember": "Primary = no single identified cause; secondary = known cause.", "pages": "60", "slide": 84, "figure": ""}, {"id": 13, "title": "Cardiac output, resistance & capillary pressure", "official": "The Big Picture: Predict how altering pressure or resistance in pre- and post-capillary regions alters capillary pressure and the consequence of this change on transmural fluid movement.", "big": "The heart and vascular resistance jointly determine how much blood reaches tissues and the pressures at capillaries.", "analogy": "Think of a pump feeding a network of adjustable taps: changing upstream or downstream taps changes pressure at the delivery site.", "teach": "Cardiac output depends on heart rate and stroke volume; stroke volume reflects preload, afterload and contractility. Dr. Metz uses CO ≈ MAP/SVR when central venous pressure is negligible. Increasing precapillary arteriolar resistance tends to reduce downstream capillary hydrostatic pressure, whereas increasing postcapillary venous resistance can raise capillary hydrostatic pressure and favor filtration.", "flow": "Precapillary constriction → capillary pressure ↓; postcapillary obstruction → capillary pressure ↑.", "confuse": "Higher systemic arterial pressure does not guarantee higher capillary pressure if upstream arterioles constrict.", "remember": "Before capillary constriction lowers Pc; after capillary blockage raises Pc.", "pages": "61–72", "slide": 90, "figure": ""}, {"id": 14, "title": "Series vs parallel resistance", "official": "Systemic Vascular Resistance (SVR): Understand the effects of adding resistance in series vs. in parallel on total resistance and flow. Apply this information to solving problems characterized by a) resistances in series and b) resistances in parallel.", "big": "Resistance adds differently depending on whether vessels are end-to-end or side-by-side.", "analogy": "One narrow hallway after another is series; several open hallways side-by-side are parallel.", "teach": "In series, Rtotal = R1 + R2 + ... . In parallel, 1/Rtotal = 1/R1 + 1/R2 + ... . Parallel routes provide additional paths for flow and lower overall resistance. Most systemic organs are arranged in parallel, allowing organ-specific regulation. Dr. Metz emphasizes how highly perfused beds can strongly influence overall SVR.", "flow": "Add a parallel pathway → total resistance decreases. Add a series segment → total resistance increases.", "confuse": "Do not add parallel resistances directly as if they were in series.", "remember": "Series = add R; parallel = add reciprocals.", "pages": "61–72", "slide": 95, "figure": ""}, {"id": 15, "title": "Venous return", "official": "Venous Return: Describe the factors that influence the return of venous blood to the right side of the heart.", "big": "Venous return is the flow of blood back to the right atrium.", "analogy": "Picture a low-pressure return hose: valves stop backward flow, muscle squeezes push blood forward, and breathing helps draw blood toward the chest.", "teach": "Venous return is driven by a pressure difference between systemic vascular filling pressure and right atrial/central venous pressure. Skeletal muscle contractions and venous valves help move blood toward the heart. Respiratory pressure changes assist return. Standing suddenly can pool blood in the lower body and temporarily reduce return, leading to orthostatic symptoms. Venoconstriction mobilizes stored blood from the compliant venous reservoir.", "flow": "Venous pooling ↑ → venous return ↓ → preload ↓ → cardiac output may ↓.", "confuse": "Venous return and cardiac output must match over time in a closed circulation.", "remember": "Valves + muscle + breathing bring blood home.", "pages": "73–75", "slide": 85, "figure": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQoMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAI3AvQDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQDBQIBBgf/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAgMBBAUG/9oADAMBAAIQAxAAAAGD181sogAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADkZdzQAAAAAAAAAAOSjhaLs30UXSwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeg4+nLQmAKSGXEkGhuRCs6Si8AAAHiezlwFFuZ6KbpYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPQcfTloTAiSjw11viVGXmo3ePq7fqF3mY+HV1mjclZy6EU4TDYuAPE9nLgKLfR2wkSiAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJ/L0SIy3Njsowra5MJ6bkuuzxtHo4erv9Rf5crN1JWwytnLGNTh0llgB5Pp5/N1WfQ67JoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIRJAIc4RZx7m76xMoee5PX0hZP6OD22U2RnByyRte+xhm5ILi0AiHiT2hNAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABFJQBClCbGepseGujg/P8Aey3q/OzMj6vlvkN1IcbOk2VYAAEQ8Se0JoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIpKBVuV7kmMtTp5JdiuXtyNHNbam9GZ+zm4bETJiXsAABEPEntCaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACKSgQ5Rlxl01KMljY34Gm6BT6M2iuRvH6f0OGVbHYGNjbkpVAACIeJPaE0AGjBu2tmzdgAAAAAARtzjLc21oA4dAAAAAAAAAAAAAAAAAAIpKBDnCZCY1IeT87ydsGnox1vd1mQh58nqp9ndwbAxsbclKoAARDxJ7QmgAp3MHbX6Km3zV1XoabK9X5te5qX5 9HX0dfR19HX0dfR19HX0dfR19HX0dfR19HX0dfR19HX0dfR19HX0dfR19HX0dfQ8BJIIdIA6Jf//Z"}, {"id": 16, "title": "Pulmonary edema", "official": "Pulmonary Edema: Explain the development of pulmonary edema by a) increased pulmonary hydrostatic pressure b) increased permeability and c) impaired venous outflow or increased central venous pressure.", "big": "Pulmonary edema means excess fluid collects in lung tissues, interfering with gas exchange.", "analogy": "Imagine the thin wall of an air-filled sponge getting waterlogged: oxygen has a harder time crossing.", "teach": "Dr. Metz links pulmonary edema to increased pulmonary capillary hydrostatic pressure, increased barrier permeability, and impaired venous outflow/elevated downstream pressure. Increased filtration overwhelms fluid removal, allowing fluid to accumulate near the alveoli. This impairs oxygenation. Heart failure is a major example discussed in the notes.", "flow": "Pulmonary capillary filtration ↑ → lung fluid ↑ → oxygen exchange worsens.", "confuse": "Pulmonary edema is fluid in the lungs, not simply increased blood volume everywhere.", "remember": "Wet lungs = poor gas exchange.", "pages": "76–77", "slide": 104, "figure": ""}, {"id": 17, "title": "Autonomic & humoral cardiovascular control", "official": "Systemic Control-Role of the Autonomic Nervous System and Humoral Agents", "big": "The medulla and circulating chemical messengers help adjust heart function and vascular tone.", "analogy": "Think of the medulla as a control room sending accelerator and brake signals.", "teach": "Sympathetic output generally raises heart rate, contractility, and vascular tone; parasympathetic output primarily slows heart rate. Dr. Metz describes cardiovascular center components and vasoactive humoral agents that constrict or dilate vessels. For each agent, learn its effect and the context in which it is released from the notes.", "flow": "Sympathetic ↑ → HR ↑, contractility ↑, and many vessels constrict; vagal ↑ → HR ↓.", "confuse": "Parasympathetic nerves do not simply oppose sympathetic activity equally in every blood vessel.", "remember": "Sympathetic = accelerator; vagus = heart-rate brake.", "pages": "78–80, 96", "slide": 109, "figure": ""}, {"id": 18, "title": "Pressure, gas & stretch sensors", "official": "Baroreceptors, Chemoreceptors, and Atrial Stretch Receptors-Compare the mechanisms of action of the receptors involved in cardiovascular control. Outline the cardiovascular reflexes initiated by decreases in blood O2 and increases in blood CO2.", "big": "Different cardiovascular receptors sense different problems.", "analogy": "Imagine three alarms: one detects pipe pressure, another detects air quality, and another detects an overfilled storage tank.", "teach": "Baroreceptors in carotid sinus and aortic arch sense arterial stretch/pressure. Chemoreceptors in carotid and aortic bodies respond to blood gases and acidity, particularly low O₂ and elevated CO₂/H⁺. Atrial stretch receptors respond to increased atrial filling and participate in volume-related responses. Their signals help the cardiovascular control centers restore homeostasis.", "flow": "Pressure changes → baroreflex; blood gas changes → chemoreflex; atrial filling ↑ → stretch responses.", "confuse": "Carotid sinus is a pressure sensor; carotid body is a chemical sensor.", "remember": "Sinus = stretch; body = blood gases.", "pages": "81–96", "slide": 112, "figure": ""}, {"id": 19, "title": "Baroreceptor reflex", "official": "Baroreceptors: Diagram the sequence of events in the baroreflex that occur after an acute increase or decrease in arterial blood pressure. Include receptor response, afferent nerve activity, CNS integration, and efferent nerve activity to the heart and blood vessels. Contrast the sympathetic and parasympathetic nervous system control of heart rate, contractility, systemic vascular resistance, and venous capacitance.", "big": "The baroreflex rapidly buffers sudden changes in arterial blood pressure.", "analogy": "Think of a thermostat: when pressure rises too high, the controller reduces the pump and relaxes the pipes.", "teach": "An acute pressure rise stretches carotid sinus and aortic arch baroreceptors more, increasing afferent firing to medullary centers. The response reduces sympathetic activity and increases parasympathetic cardiac activity, lowering HR, contractility and vascular resistance. A sudden pressure fall produces the opposite pattern: baroreceptor firing falls, sympathetic output increases, vagal output falls, and HR/vascular tone rise.", "flow": "BP ↑ → baroreceptor firing ↑ → SNS ↓ / PSNS ↑ → BP tends ↓. BP ↓ → reverse.", "confuse": "The baroreceptor is stimulated by stretch; a falling BP decreases, not increases, its firing.", "remember": "High BP = more sensor firing = more braking.", "pages": "81–92", "slide": 96, "figure": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQoMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAI3AvQDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQDBQIBBgf/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQMCBAUG/9oADAMBAAIQAxAAAAGD181usgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYTnvzfRRdqAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMBy35nopu1AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGA5b/AEduJGsgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeZ57voddk0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+fHtCaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAfPj2hNAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPnx7QmgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHz49oTQACtGkr4kCqYqRbE2pAAAAAAAAAA4dAAAAAAAAAAAAAAABj434bHR9C3yXyAAAAAAAAAAA+fHtCaADh5e+mRmcljc/Oh5m6qbnWN3j0lNvQbwrlbCiUmJpmOw0lbDZMaYkxOiNZWQqlvDD24yVe7DptCuW8K5SIkAAAAAAAAAAAAfMqfQhRZ9Hu83JzkAAAAAAAAAAD58e0JoAAPP215XGpedDzN1Vhj9Z9RRdi7MQN5yGNUzFMxkcbrmMPZjJY1fmYW4kZmTE0zEXUWw7E8mKJiyJlZmPqKy6Gso0xPzrLV7viQAAAAAAAAAABw+T0eqifpl/lzZyAAAAAAAAAAB8+ d flow.", "big": "Autoregulation helps an organ maintain relatively stable flow even when arterial pressure changes.", "analogy": "A smart faucet adjusts its opening when the water-main pressure changes.", "teach": "Local vessels adjust their resistance to compensate for changes in perfusion pressure. When pressure rises, local arterioles may constrict; when it falls, they may dilate, within the tissue’s autoregulatory range. This local adjustment protects tissue perfusion rather than allowing flow to change directly in proportion to every pressure fluctuation.", "flow": "Pressure ↑ → local resistance ↑ → flow stays closer to baseline.", "confuse": "Autoregulation is local control; it is not the same as a whole-body baroreflex.", "remember": "Pressure changes, tissue adjusts the tap.", "pages": "97–98", "slide": 117, "figure": ""}, {"id": 21, "title": "Myogenic response", "official": "Myogenic Mechanism: Describe the contribution of myogenic tone to blood flow regulation.", "big": "Vascular smooth muscle can respond directly to stretch.", "analogy": "When you pull a spring-loaded gate open, it pushes back.", "teach": "Higher intraluminal pressure stretches arteriolar smooth muscle. In Dr. Metz’s myogenic mechanism, this promotes membrane and calcium-dependent contraction. The arteriole constricts, raising resistance and opposing the increase in flow. Reduced stretch favors relaxation. This is one mechanism of local autoregulation.", "flow": "Pressure/stretch ↑ → intracellular Ca²⁺ response → constriction → resistance ↑.", "confuse": "Myogenic control comes from the vessel wall itself, not necessarily a nerve signal.", "remember": "Stretch → squeeze back.", "pages": "98", "slide": 118, "figure": ""}, {"id": 22, "title": "Nitric oxide", "official": "Nitric Oxide: Diagram the synthetic pathway for nitric oxide (EDRF, endothelial derived relaxing factor), including substrate and the interplay between endothelium and vascular smooth muscle.", "big": "Endothelial nitric oxide (NO) relaxes vascular smooth muscle.", "analogy": "The vessel lining sends a message telling the surrounding muscle ring to loosen.", "teach": "Endothelial nitric oxide synthase (NOS) produces NO from its substrate described in the notes. Stimuli include increased shear stress and selected chemical signals. NO diffuses into vascular smooth muscle and stimulates the cyclic-GMP relaxation pathway, promoting vasodilation. This lowers local resistance and can increase flow.", "flow": "Shear stress ↑ → endothelial NO ↑ → smooth muscle relaxes → vessel dilates.", "confuse": "NO is made by endothelial cells and acts on adjacent smooth muscle; it is not itself a muscle.", "remember": "NO = No tightening.", "pages": "99–100", "slide": 120, "figure": ""}, {"id": 23, "title": "Active vs reactive hyperemia", "official": "Active Hyperemia vs. Reactive Hyperemia: Evaluate how the theory of metabolic regulation of blood flow accounts for active hyperemia and reactive hyperemia. You should be able to compare and contrast:", "big": "Both cause increased local blood flow, but they have different triggers.", "analogy": "Active hyperemia is opening extra lanes during rush hour. Reactive hyperemia is the surge after a roadblock is removed.", "teach": "Active hyperemia occurs when tissue metabolic activity rises: local vasodilator signals increase flow to meet demand. Reactive hyperemia follows temporary interruption of blood flow: metabolites accumulate and low oxygen favors dilation; once the blockage ends, flow briefly overshoots baseline. As metabolic demand or accumulated metabolites normalize, flow returns toward baseline.", "flow": "Exercise/activity ↑ → active hyperemia. Temporary occlusion then release → reactive hyperemia.", "confuse": "Reactive hyperemia is AFTER an interruption; active hyperemia is DURING increased activity.", "remember": "Active = activity; reactive = rebound.", "pages": "101–104", "slide": 123, "figure": ""}, {"id": 24, "title": "Cerebral circulation", "official": "Special Circulations: Cerebral Circulation-Contrast the relative dominance of autonomic versus local control mechanisms in the cerebral circulation.", "big": "The brain relies strongly on local control to maintain its blood supply.", "analogy": "Think of a high-priority building that automatically regulates its water supply.", "teach": "Dr. Metz emphasizes cerebral autoregulation and local chemical factors over simple direct autonomic control. Changes in CO₂ and associated acidity are important drivers of cerebral vessel diameter. Elevated CO₂ generally favors dilation and increased cerebral flow; reduced CO₂ favors constriction. This helps match blood supply to brain conditions.", "flow": "CO₂ ↑ → cerebral dilation → cerebral blood flow ↑.", "confuse": "Brain blood flow regulation is not identical to pulmonary oxygen-sensing responses.", "remember": "Brain vessels listen closely to CO₂.", "pages": "105–109", "slide": 126, "figure": ""}, {"id": 25, "title": "Coronary circulation", "official": "Special Circulation: Coronary Circulation-Contrast the relative dominance of autonomic versus local control mechanisms in the coronary circulation.", "big": "The heart muscle needs its own blood supply, especially when it works harder.", "analogy": "Picture a sponge being squeezed: vessels running through it are compressed during the squeeze.", "teach": "Coronary flow is strongly affected by local metabolic demand. Ventricular contraction compresses coronary vessels, especially on the left side, so much left ventricular coronary perfusion occurs during diastole. Increasing HR shortens diastole, potentially reducing coronary perfusion time even while the heart needs more oxygen. Local metabolites promote vasodilation to meet demand.", "flow": "HR ↑ → diastolic time ↓ → time available for left coronary perfusion ↓.", "confuse": "Do not assume coronary blood flow is greatest during ventricular systole just because the heart is pumping.", "remember": "Left coronary flow loves diastole.", "pages": "107–111", "slide": 121, "figure": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQoMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAI3AvQDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQFAwIBBgf/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAwIBBAUG/9oADAMBAAIQAxAAAAGD182W1QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKTnnu+iDNbAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKDlnueiHNbAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKDln9HLSRaoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHmeeb6HHJNAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPnx7QmgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHz49oTQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD58e0JoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB8+PaE0AA4RLVz13K0AAAAAAAADhDtWVXeG7egAAxbmXNA4aM2bsAAAAAAAAAAAAAAAAAAAAAAAD58e0JoAB5iaKxparkp6WCXTWXAx6yYxazZum5wzZsbcy46YtZcdbxmzfLTw2sd6mSl3FJKzeGXNwbmbHW6soJo/RQyxtrnzfPzR2cd5eboZMdMesmN2gAAAAAAAAAAAAAAAAAAAAfPj2hNABozzs0fpYZRTyU0ZAvXJmzK7X3rNrbGRrV1LuOSPuVt6Zc2XXY1slV2xpfTcr71vIpBQSx4tzJmx7ZOpsW2W8d6mSgnUsKuSmhLruRvCHaubNl12DfPTwSgAAAAAAAAAAAAAAAAAAAAfPj2hNABw8xPD6iCasvSnkp6mCbzs0XD0MMlDNHfQyeW6IrWO+Dc3MZAvWZXfRwy+cmi6eihlxblBLH6SGWmkpH2umvQQyeemj9HDLQSxWdL1ElNjPm6kG1ZObJrsC9fRwy0slI9q+ogm85NF6OGUAAAAAAAAAAAAAAAAAAAAD58e0JoABWXpAvXfNt4700kebNytto70cseJlnS/DFudIlsx7kytraO9bekbcu45BTyUi2rnrsjNx6tI7VclY25ZUtVSU6TK2Yw2zQkZuHcsaWqr0ytzZttHepkpbR3AAAAAAAAAAAAAAAAAAAAA+fHtCaAAAAAAAAAAAecmi9BDJu0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAfPj2hNAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPnx7QmgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHz49oTQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD58e0JoAAAAAAAAAOAMNMHWgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAfPj2hNAAAAAAAAAOHlaS+dyW62mMiLewtBY7XoAAAAAAAAAAB489eeUPUnTh0rC1IJKOnTU3NTY1KwtTQ3NCuLQ6AAAAAAAAD58e0JoAAAAAAABwA+bR9lbWXdm25hLq0P0K/N0AAAAAAAAAAqporWGXwxcEc4bEQsiKerPLmE0JpCJhiMpBNiyKMsTQ2PTmQAAAAAAA nses of systemic and pulmonary circulatory beds that occur in response to hypoxia.", "big": "Low oxygen causes opposite local vessel responses in pulmonary and systemic beds.", "analogy": "In body tissues, open roads to bring oxygen. In lungs, close roads to poorly ventilated air sacs.", "teach": "In most systemic tissues, local low O₂ promotes vasodilation so more oxygenated blood can arrive. In pulmonary circulation, low alveolar O₂ causes local vasoconstriction, diverting blood toward better ventilated alveoli. This helps match ventilation and perfusion.", "flow": "Systemic hypoxia → dilation; pulmonary alveolar hypoxia → constriction.", "confuse": "Pulmonary vasoconstriction is a local matching response, not a general rule for every vessel.", "remember": "Body: open for O₂. Lung: redirect from low O₂.", "pages": "110–114", "slide": 132, "figure": ""}, {"id": 27, "title": "Cutaneous circulation & temperature", "official": "Special Circulation: Cutaneous Circulation-Discuss the unique characteristics of skin blood flow that are adaptive for body temperature regulation. Contrast the neural responses that would occur in cold versus warm ambient conditions.", "big": "Skin blood flow helps regulate body heat, not just oxygen delivery.", "analogy": "Your skin is like a radiator: send more warm blood to its surface to lose heat, or less to conserve heat.", "teach": "Temperature-sensitive receptors inform neural control circuits. In warm conditions, skin vessels dilate and blood flow to the surface increases, supporting heat loss. In cold conditions, sympathetic vasoconstriction reduces skin blood flow, limiting heat loss. Dr. Metz also discusses specialized cutaneous pathways used for thermoregulation.", "flow": "Warm → skin blood flow ↑ → heat loss ↑. Cold → skin blood flow ↓ → heat conserved.", "confuse": "The main goal of skin circulation can be temperature regulation rather than matching metabolic demand.", "remember": "Warm = radiator ON; cold = radiator OFF.", "pages": "112–117", "slide": 135, "figure": ""}];
